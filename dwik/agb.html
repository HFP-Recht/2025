<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGB Lerntool - Werkstatt</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8">

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // SVG Icons als kleine Komponenten für einfaches Copy-Paste
        const BookIcon = () => <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>;
        const AlertIcon = () => <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>;
        const ScaleIcon = () => <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"></path><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"></path><path d="M7 21h10"></path><path d="M12 3v18"></path><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"></path></svg>;
        const FileIcon = () => <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" x2="8" y1="13" y2="13"></line><line x1="16" x2="8" y1="17" y2="17"></line><line x1="10" x2="8" y1="9" y2="9"></line></svg>;
        const CheckIcon = () => <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5 mr-2 text-blue-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>;
        const XIcon = () => <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6 mr-3 text-red-500 flex-shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" x2="9" y1="9" y2="15"></line><line x1="9" x2="15" y1="9" y2="15"></line></svg>;

        const AGBLearningModule = () => {
            const [activeTab, setActiveTab] = useState('einbezug');

            const tabs = [
                { id: 'einbezug', title: '1. Geltung & Einbezug', icon: <BookIcon /> },
                { id: 'ungewoehnlich', title: '2. Ungewöhnlichkeitsregel', icon: <AlertIcon /> },
                { id: 'schranken', title: '3. Grenzen & Schranken', icon: <ScaleIcon /> },
                { id: 'spezialfaelle', title: '4. Spezialfälle im Alltag', icon: <FileIcon /> }
            ];

            return (
                <div className="w-full max-w-4xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200 font-sans">
                    <div className="bg-slate-800 text-white p-6">
                        <h1 className="text-2xl font-bold">Allgemeine Geschäftsbedingungen (AGB) in der Werkstatt</h1>
                        <p className="text-slate-300 mt-2">Vom korrekten Einbezug bis zu den rechtlichen Schranken – das Prüfungswissen für angehende Werkstattleiter/innen.</p>
                    </div>

                    <div className="flex border-b border-gray-200 overflow-x-auto bg-slate-50">
                        {tabs.map((tab) => (
                            <button
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`flex items-center space-x-2 px-6 py-4 font-medium text-sm transition-colors whitespace-nowrap ${
                                    activeTab === tab.id
                                        ? 'border-b-2 border-blue-600 text-blue-700 bg-white'
                                        : 'text-gray-500 hover:text-gray-700 hover:bg-gray-100'
                                }`}
                            >
                                {tab.icon}
                                <span>{tab.title}</span>
                            </button>
                        ))}
                    </div>

                    <div className="p-8">
                        {activeTab === 'einbezug' && (
                            <div className="space-y-6 animate-fade-in">
                                <h2 className="text-xl font-bold text-gray-800 border-b pb-2">Wie werden AGB zum Vertragsbestandteil?</h2>
                                <p className="text-gray-600">AGB gelten nicht automatisch. Damit sie rechtlich bindend werden, müssen zwei Voraussetzungen zwingend <strong>vor oder bei Vertragsabschluss</strong> erfüllt sein:</p>
                                <div className="grid md:grid-cols-2 gap-6 mt-4">
                                    <div className="bg-blue-50 p-5 rounded-lg border border-blue-100">
                                        <h3 className="font-bold text-blue-800 flex items-center mb-2"><CheckIcon />1. Möglichkeit der Kenntnisnahme</h3>
                                        <p className="text-sm text-gray-700">Der Kunde muss die zumutbare Möglichkeit haben, die AGB zu lesen, bevor er zustimmt. Ein Hinweis auf der Vorderseite des Vertrages reicht aus. Der Kunde muss sie nicht tatsächlich lesen.</p>
                                    </div>
                                    <div className="bg-blue-50 p-5 rounded-lg border border-blue-100">
                                        <h3 className="font-bold text-blue-800 flex items-center mb-2"><CheckIcon />2. Globalübernahme</h3>
                                        <p className="text-sm text-gray-700">Der Kunde stimmt der Geltung des gesamten AGB-Werks pauschal zu (ausdrücklich durch Unterschrift oder stillschweigend durch schlüssiges Verhalten).</p>
                                    </div>
                                </div>
                                <div className="bg-red-50 p-4 rounded-lg border border-red-200 flex items-start mt-6">
                                    <XIcon />
                                    <div>
                                        <h4 className="font-bold text-red-800">Die Timing-Falle</h4>
                                        <p className="text-sm text-red-700">Ein Verweis auf die AGB, der erst <strong>nach</strong> Vertragsabschluss erfolgt (z.B. ein Aufdruck auf der Rechnung nach der Reparatur oder Beilage zur Auftragsbestätigung), ist zu spät. Die AGB werden in diesem Fall nicht Vertragsbestandteil!</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'ungewoehnlich' && (
                            <div className="space-y-6">
                                <h2 className="text-xl font-bold text-gray-800 border-b pb-2">Die Ungewöhnlichkeitsregel & Unklarheiten</h2>
                                <p className="text-gray-600">Selbst wenn AGB korrekt einbezogen wurden (Globalübernahme), schützt die Rechtsprechung den Kunden vor bösen Überraschungen.</p>
                                <div className="bg-yellow-50 p-5 rounded-lg border border-yellow-200">
                                    <h3 className="font-bold text-yellow-800 text-lg mb-2">Die Ungewöhnlichkeitsregel</h3>
                                    <p className="text-gray-700 mb-3">Klauseln, mit denen eine Partei vernünftigerweise nicht rechnen muss, werden nicht Vertragsbestandteil, wenn sie nicht besonders hervorgehoben wurden. Eine Klausel ist ungewöhnlich, wenn sie:</p>
                                    <ul className="list-disc pl-5 space-y-1 text-gray-700 mb-4">
                                        <li>geschäftsfremd ist (passt nicht zum Vertragstyp) UND</li>
                                        <li>die Rechtsposition des Vertragspartners erheblich schwächt.</li>
                                    </ul>
                                    <div className="bg-white p-3 rounded border border-yellow-300 text-sm">
                                        <strong>Praxis-Beispiel:</strong> Eine AGB-Klausel in einem Reparaturvertrag, die besagt: <em>"Ausschliesslicher Gerichtsstand für alle Streitigkeiten ist St. Gallen"</em>, obwohl der Kunde (Konsument) aus Genf kommt. Diese Klausel weicht vom gesetzlichen Konsumentengerichtsstand ab, ist versteckt und für den Kunden extrem nachteilig. Sie fällt aus dem Vertrag.
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'schranken' && (
                            <div className="space-y-6">
                                <h2 className="text-xl font-bold text-gray-800 border-b pb-2">Grenzen der Vertragsfreiheit in AGB</h2>
                                <p className="text-gray-600">AGB dürfen nicht alles regeln. Bestimmte gesetzliche Schranken können auch durch eine Unterschrift unter die AGB nicht ausgehebelt werden. Verstossen Klauseln hiergegen, sind sie <strong>nichtig</strong>.</p>
                                <div className="space-y-4">
                                    <div className="flex bg-white p-4 rounded-lg shadow-sm border border-gray-200">
                                        <div className="w-1/3 font-bold text-indigo-700">Art. 20 OR (Grundschranken)</div>
                                        <div className="w-2/3 text-sm text-gray-700">AGB-Klauseln sind nichtig, wenn sie objektiv <strong>unmöglich</strong>, <strong>widerrechtlich</strong> oder <strong>sittenwidrig</strong> sind.</div>
                                    </div>
                                    <div className="flex bg-white p-4 rounded-lg shadow-sm border border-gray-200">
                                        <div className="w-1/3 font-bold text-indigo-700">Art. 100 OR (Haftung)</div>
                                        <div className="w-2/3 text-sm text-gray-700">Ein totaler Haftungsausschluss ("Jegliche Haftung wird vollumfänglich ausgeschlossen") ist nichtig. Die Haftung für <strong>Absicht und grobe Fahrlässigkeit</strong> kann im Voraus gesetzlich nicht wegbedungen werden.</div>
                                    </div>
                                    <div className="flex bg-white p-4 rounded-lg shadow-sm border border-gray-200">
                                        <div className="w-1/3 font-bold text-indigo-700">Art. 8 UWG (Konsumentenschutz)</div>
                                        <div className="w-2/3 text-sm text-gray-700">Gegenüber Konsumenten sind AGB missbräuchlich und unlauter, wenn sie ein <strong>erhebliches und ungerechtfertigtes Missverhältnis</strong> zwischen den vertraglichen Rechten und Pflichten vorsehen. (Beispiel: Rügefrist für versteckte Mängel auf 24h verkürzt).</div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'spezialfaelle' && (
                            <div className="space-y-6">
                                <h2 className="text-xl font-bold text-gray-800 border-b pb-2">Spezialfälle im Werkstattalltag</h2>
                                <div className="bg-purple-50 p-5 rounded-lg border border-purple-200 mb-6">
                                    <h3 className="font-bold text-purple-800 text-lg mb-2">"Battle of the Forms" (Kampf der Formulare)</h3>
                                    <p className="text-gray-700 mb-3 text-sm"><strong>Situation:</strong> Eine Werkstatt bestellt Teile und verweist auf ihre Einkaufs-AGB. Der Lieferant bestätigt und verweist auf seine eigenen Verkaufs-AGB. Die Klauseln (z.B. zu Konventionalstrafen) widersprechen sich komplett.</p>
                                    <div className="bg-white p-3 rounded border border-purple-300 text-sm mt-3">
                                        <strong>Lösung in der Schweiz (Knock-Out-Theorie):</strong> Ein Vertrag kommt in den wesentlichen Punkten trotzdem zustande. Die sich widersprechenden AGB-Klauseln heben sich jedoch gegenseitig auf ("knock out") und fallen aus dem Vertrag. An ihre Stelle tritt das dispositive Gesetzesrecht (OR).
                                    </div>
                                </div>
                                <div className="bg-orange-50 p-5 rounded-lg border border-orange-200">
                                    <h3 className="font-bold text-orange-800 text-lg mb-2">AGB nachträglich ändern</h3>
                                    <p className="text-gray-700 mb-3 text-sm"><strong>Situation:</strong> Ein Betrieb schickt Kunden neue AGB mit höheren Preisen und dem Vermerk: "Wenn wir bis Ende Monat nichts hören, gilt dies als Zustimmung."</p>
                                    <div className="bg-white p-3 rounded border border-orange-300 text-sm mt-3">
                                        <strong>Lösung (OR Art. 6):</strong> Schweigen auf eine für den Kunden nachteilige Vertragsänderung gilt grundsätzlich <strong>nicht</strong> als Annahme. Ohne aktive Zustimmung des Kunden kommt keine Vertragsänderung zustande, die neuen AGB sind nicht bindend.
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AGBLearningModule />);
    </script>
</body>
</html>
